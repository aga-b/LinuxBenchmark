name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: [self-hosted, linux, x64, ci-linux]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9+ required"'
      - name: Syntax
        run: |
          bash -n r740-health.sh
          python3 -m py_compile linuxbenchmark.py tests/test_linuxbenchmark.py
      - name: Hardware-free regression tests
        run: python3 -m unittest discover -s tests -v
      - name: CLI smoke tests (no host collection or load)
        run: |
          bash r740-health.sh --help
          bash r740-health.sh --dry-run
          bash r740-health.sh --mode full --fio-dir /example --dry-run
